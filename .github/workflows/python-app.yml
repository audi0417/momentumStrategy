name: Stock Screening
on:
  schedule:
    - cron: '0 21 * * 0-4'  # 每個工作日早上 5:00 (UTC+8) 運行
  workflow_dispatch:  # 允許手動觸發
jobs:
  screen:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
         python-version: '3.11'
         
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run screening script (0 支結果時重試，資料源可能尚未入庫完整)
      env:
        APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        RECIVER_EMAIL: ${{ secrets.RECIVER_EMAIL }}
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
      run: |
        for attempt in 1 2 3; do
          python 動能選股.py
          count=$(python -c "import json;print(len(json.load(open('stocks_data.json')).get('stocks', {})))" 2>/dev/null || echo 0)
          echo "第 $attempt 次執行，篩選出 $count 支"
          if [ "$count" != "0" ] || [ "$attempt" -eq 3 ]; then
            break
          fi
          echo "結果為 0，5 分鐘後重試"
          sleep 300
        done
    
    - name: Archive historical data
      run: python archive_data.py
    
    - name: Generate stock price data for web
      run: python generate_stock_data.py
    
    - name: Copy historical data to web folder
      run: |
        cp historical_data.json web/historical_data.json
        echo "✅ Copied historical_data.json to web folder"

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add stocks_data.json historical_data.json stock_metadata.json web/stock_price_data.json web/historical_data.json
        if git diff --cached --quiet; then
          echo "無變更"
          exit 0
        fi
        git commit -m "更新股票數據和價格圖表數據 $(date +'%Y-%m-%d')"
        git pull --rebase origin main
        git push

    # 放在 push 之後：結果為空仍要歸檔，但要讓這次 run 顯示失敗
    - name: Sanity check screening results
      run: python check_results.py
